name: Verify website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test HTTP behavior and race safety
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build deployment image
        run: docker build --build-arg VERSION="$(git describe --tags --long --dirty --always)" -t tendui-web:ci .
      - name: Smoke-test the deployed image
        run: |
          docker run --detach --name tendui-web-ci -p 127.0.0.1:8080:8080 tendui-web:ci
          trap 'docker logs tendui-web-ci; docker rm -f tendui-web-ci' EXIT
          curl --fail --max-time 5 --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 20 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/ | grep -F 'Start building'
          curl --fail http://127.0.0.1:8080/site.css > /dev/null
          curl --fail http://127.0.0.1:8080/docs/install > /dev/null
          curl --fail http://127.0.0.1:8080/catalog/button > /dev/null
          curl --fail http://127.0.0.1:8080/playground > /dev/null
