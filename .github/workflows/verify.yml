name: Verify website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test HTTP behavior and race safety
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build deployment image
        run: docker build --build-arg VERSION="$(git describe --tags --long --dirty --always)" -t gothui-web:ci .
      - name: Smoke-test the deployed image
        run: |
          docker run --detach --name gothui-web-ci -p 127.0.0.1:8080:8080 gothui-web:ci
          trap 'docker rm -f gothui-web-ci' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/ | grep -F 'Website coming soon'
          curl --fail http://127.0.0.1:8080/site.css > /dev/null
